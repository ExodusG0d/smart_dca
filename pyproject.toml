[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-dca"
version = "0.1.0"
description = "Configuration-driven smart DCA planner for major index ETFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=1.10",
    "PyYAML>=6.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
smart-dca = "smart_dca.cli:app"

[tool.setuptools.packages.find]
include = ["smart_dca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
